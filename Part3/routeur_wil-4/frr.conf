frr defaults traditional
hostname hduflos-routeur_wil-4
service integrated-vtysh-config
!
! =========================================================================
! routeur_wil-4 – VTEP leaf router (connected to host_wil-3)
!
! Role: VXLAN Tunnel End Point.  Bridges host_wil-3 into VNI 10 and
! advertises its MAC address as an EVPN type-2 route to the RR.
!
! Connections:
!   lo      1.1.1.4/32  – VTEP source IP
!   eth0    10.1.3.2/30 – underlay link to routeur_wil-1 (RR)
!   eth1    (no IP)     – host-facing port, member of bridge br0
! =========================================================================
!
interface lo
 ip address 1.1.1.4/32
 ip ospf area 0
!
interface eth0
 ip address 10.1.3.2/30
 ip ospf area 0
!
router ospf
 ospf router-id 1.1.1.4
!
router bgp 65000
 bgp router-id 1.1.1.4
 no bgp default ipv4-unicast
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source lo
 !
 address-family l2vpn evpn
  neighbor 1.1.1.1 activate
  advertise-all-vni
 exit-address-family
!
line vty
!
