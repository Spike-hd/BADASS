frr defaults traditional
hostname hduflos-routeur_wil-1
service integrated-vtysh-config
!
! --- Loopback (router-id, reachable via OSPF by all VTEPs) ---------------
interface lo
 ip address 1.1.1.1/32
 ip ospf area 0
!
! --- Underlay links (point-to-point /30 toward each leaf) ----------------
interface eth0
 ip address 10.1.1.1/30
 ip ospf area 0
!
interface eth1
 ip address 10.1.2.1/30
 ip ospf area 0
!
interface eth2
 ip address 10.1.3.1/30
 ip ospf area 0
!
router ospf
 ospf router-id 1.1.1.1
!
! --- BGP Route Reflector --------------------------------------------------
router bgp 65000
 bgp router-id 1.1.1.1
 !
 ! Disable IPv4 unicast by default – we only carry L2VPN EVPN here.
 no bgp default ipv4-unicast
 !
 ! "ibgp" peer-group shared by all VTEP clients.
 neighbor ibgp peer-group
 neighbor ibgp remote-as 65000
 ! VTEPs connect using their loopback as source → update-source lo here too.
 neighbor ibgp update-source lo
 !
 bgp listen range 1.1.1.0/29 peer-group ibgp
 !
 address-family l2vpn evpn
  ! Activate EVPN for the ibgp peer-group (VTEPs).
  neighbor ibgp activate
  ! Mark every ibgp client as an RR client – the RR reflects routes
  ! received from one client to all other clients automatically.
  neighbor ibgp route-reflector-client
 exit-address-family
!
line vty
!
