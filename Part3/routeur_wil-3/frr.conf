frr defaults traditional
hostname hduflos-routeur_wil-3
service integrated-vtysh-config
!
! =========================================================================
! routeur_wil-3 – VTEP leaf router (no local host in this topology)
!
! Role: VXLAN Tunnel End Point.  Participates in the EVPN control plane
! and the VNI-10 overlay.  It receives type-2 and type-3 routes from the
! RR so it can forward traffic to remote hosts if a host is added later.
! Its presence also confirms multi-VTEP visibility during evaluation.
!
! Connections:
!   lo      1.1.1.3/32  – VTEP source IP
!   eth0    10.1.2.2/30 – underlay link to routeur_wil-1 (RR)
! =========================================================================
!
interface lo
 ip address 1.1.1.3/32
 ip ospf area 0
!
interface eth0
 ip address 10.1.2.2/30
 ip ospf area 0
!
router ospf
 ospf router-id 1.1.1.3
!
router bgp 65000
 bgp router-id 1.1.1.3
 no bgp default ipv4-unicast
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source lo
 !
 address-family l2vpn evpn
  neighbor 1.1.1.1 activate
  advertise-all-vni
 exit-address-family
!
line vty
!
